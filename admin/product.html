<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Product</title>
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
    <header class="admin-header">
        <h1>Muse Bags - Admin</h1>
        <nav>
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="product.html">Product toevoegen</a></li>
                <li><a href="login.html">Uitloggen</a></li>
            </ul>
        </nav>
    </header>
    <main class="admin-main">
        <h2>Product toevoegen</h2>

        <form class="product-form">
            <div class="form-group">
                <label for="naam">Productnaam</label>
                <input type="text" id="naam" placeholder="Vul de productnaam in">
            </div>

            <div class="form-group">
                <label for="prijs">Prijs</label>
                <input type="number" id="prijs" placeholder="Vul de prijs in">
            </div>

            <div class="form-group">
                <label for="categorie">Categorie</label>
                <select id="categorie">
                    <option value="handtassen">Handtassen</option>
                    <option value="schoudertassen">Schoudertassen</option>
                    <option value="rugzakken">Rugzakken</option>
                </select>
            </div>

            <div class="form-group">
                <label for="beschrijving">Beschrijving</label>
                <textarea id="beschrijving" rows="4" placeholder="Vul een beschrijving in"></textarea>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox"> Op voorraad
                </label>
            </div>

            <button type="submit" class="btn-submit">Product toevoegen</button>
        </form>
    </main>
</body>
</html>
